name: Build resume

on:
  push:
    branches: [main]
    paths:
      - profile.yml
      - resume.typ
      - fonts/**
      - .github/workflows/resume.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resume
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: v0.15.1

      - name: Compile PDF
        run: typst compile --font-path fonts --ignore-system-fonts resume.typ resume.pdf

      - name: ATS check (text layer must be clean and complete)
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          pdftotext resume.pdf resume.txt
          fail=0
          check() { grep -qF -- "$1" resume.txt || { echo "::error::missing in PDF text: $1"; fail=1; }; }
          check "$(yq -r .name profile.yml)"
          for h in "Professional Summary" "Professional Experience" "Education" "Skills"; do check "$h"; done
          while IFS= read -r skill; do check "$skill"; done < <(yq -r '.skills[].items[] | select(test("TODO") | not)' profile.yml)
          if grep -q "TODO" resume.txt; then echo "::error::TODO leaked into PDF"; fail=1; fi
          if grep -qP '[\x{FB00}-\x{FB06}]' resume.txt; then echo "::error::ligature glyphs found"; fail=1; fi
          pages=$(pdfinfo resume.pdf | awk '/^Pages:/ {print $2}')
          echo "pages: $pages"
          [ "$pages" -le 2 ] || { echo "::error::resume is longer than 2 pages"; fail=1; }
          exit $fail

      - name: Ask the profile README to resync
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.README_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "README_SYNC_TOKEN not set: README syncs on its nightly run"; exit 0; fi
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/M1re/M1re/dispatches -d '{"event_type":"profile-updated"}'

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf
          git diff --cached --quiet && { echo "PDF unchanged"; exit 0; }
          git commit -m "Build resume.pdf"
          git push
