    start: 2026-01
    end: present
    context: >-
      Travel platform: search and data-indexing services on Apache Solr and MS SQL Server.
    stack: .NET, Apache Solr, MS SQL Server, Azure, GitHub Actions, Datadog, Claude Code
    highlights:
      - Developed an AI-assisted validation workflow on Claude Code that compares migrated Solr indexes and search results with production and traces each real mismatch to its cause in code.
      - Migrated 70% of the platform's search indexes from Solr 6 to Solr 9, updating schemas, field types and the .NET client.
      - Reworked data loading in the indexing pipeline using SQL execution plans and parallel loading, reducing average rebuild time from 60 to 15–25 minutes.
      - Moved index-build logic from five legacy projects into a shared config-driven .NET framework, making new indexes faster to add and failures easier to trace.
      - Set up GitHub Actions pipelines for index builds with post-build reports and per-index Datadog dashboards.
      - Onboarded four engineers onto the indexing platform and became the team's main point of contact for it.

  - role: .NET Software Engineer
    company: DataArt
    location: Remote
    start: 2024-11
    end: 2026-01
    context: >-
      Automated biorepository: robotic sample handling, camera-based label recognition and a lab CMS.
    stack: .NET, ML.NET, ONNX, YOLO, Python, RabbitMQ, C++, AWS EKS, Kubernetes, Helm, GitLab CI
    highlights:
      - Led the migration of 8–9 services from Docker Swarm to Kubernetes on AWS EKS, with Helm charts, health probes, autoscaling and GitLab CI pipelines.
      - Tracked down an unmanaged memory leak in an ML.NET image-processing service that crashed containers, saving $700 per month per environment.
      - Fine-tuned and benchmarked open-source YOLO models for QR-code and label detection, then integrated the selected model into .NET services via ONNX.
      - Rewrote the C# post-processing for model output, fixing shifted and duplicated detections.
      - Improved QR decoding in a C++ ZXing module connected to .NET over RabbitMQ through image preprocessing and camera tuning.
      - Built a ComfyUI pipeline that generates synthetic training images, replacing manual test-data preparation.
      - Built a service that brings Grafana and Kibana data into the lab CMS, and delivered Angular features for it.

